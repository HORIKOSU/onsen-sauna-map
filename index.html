<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>関東 温泉・サウナ カバレッジマップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --surface-1:#fcfcfb; --page:#f9f9f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --hairline:#e1e0d9; --border:rgba(11,11,11,0.10);
  --visited:#eb6834; --want:#eda100; --unvisited:#898781;
  --seq-100:#cde2fb; --seq-200:#9ec5f4; --seq-300:#6da7ec; --seq-400:#3987e5; --seq-500:#256abf; --seq-600:#184f95; --seq-700:#0d366b;
  --accent:#2a78d6;
  --good:#0ca30c;
  --type-onsen:#e34948; --type-sauna:#2a78d6; --type-spa:#1baf7a; --type-sento:#8b5cf6;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  font-family:"M PLUS Rounded 1c",system-ui,-apple-system,"Segoe UI","Hiragino Sans",sans-serif;
  background:var(--page); color:var(--ink-1); font-size:15px;
  display:flex; flex-direction:column;
}
/* ---------- header ---------- */
header{
  flex:0 0 auto; background:var(--surface-1); border-bottom:1px solid var(--hairline);
  padding:10px 14px 8px; display:flex; align-items:center; gap:10px;
}
header .title{flex:1; min-width:0}
header h1{margin:0; font-size:15px; font-weight:800; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
header .sub{font-size:11px; color:var(--ink-3); margin-top:1px}
.coverage-pill{
  background:linear-gradient(135deg,var(--seq-500),var(--seq-700)); color:#fff;
  border-radius:20px; padding:6px 13px; text-align:center; flex:0 0 auto;
}
.coverage-pill .pct{font-size:17px; font-weight:800; line-height:1}
.coverage-pill .cnt{font-size:10px; opacity:.85; margin-top:2px}
.icon-btn{
  flex:0 0 auto; width:36px; height:36px; border-radius:50%; border:1px solid var(--hairline);
  background:var(--surface-1); font-size:17px; color:var(--ink-2); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
/* ---------- tabs ---------- */
nav.tabs{
  flex:0 0 auto; display:flex; background:var(--surface-1); border-top:1px solid var(--hairline);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1; border:0; background:none; padding:9px 0 8px; font-family:inherit; cursor:pointer;
  font-size:11px; font-weight:700; color:var(--ink-3); display:flex; flex-direction:column; align-items:center; gap:2px;
}
nav.tabs button .ico{font-size:19px; line-height:1}
nav.tabs button.active{color:var(--accent)}
/* ---------- main ---------- */
main{flex:1 1 auto; position:relative; overflow:hidden}
.view{position:absolute; inset:0; display:none; overflow-y:auto; -webkit-overflow-scrolling:touch}
.view.active{display:block}
/* ---------- filter bar (共通) ---------- */
.filterbar{
  position:sticky; top:0; z-index:5; background:var(--page);
  display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:10px 14px 8px;
}
.filterbar::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; border:1px solid var(--border); background:var(--surface-1); color:var(--ink-2);
  border-radius:16px; padding:6px 12px; font-size:12px; font-weight:700; font-family:inherit; cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
}
.chip.on{background:var(--ink-1); color:#fff; border-color:var(--ink-1)}
select.chip{appearance:none}
/* ---------- FAB（全タブ共通・fixed） ---------- */
.fab{
  position:fixed; right:14px; bottom:calc(78px + env(safe-area-inset-bottom)); z-index:900;
  width:52px; height:52px; border-radius:50%; border:0; cursor:pointer;
  background:var(--accent); color:#fff; font-size:26px; line-height:1;
  box-shadow:0 3px 10px rgba(42,120,214,.4);
}
/* ---------- coverage view（都県カード＋スタンプ格子） ---------- */
.cov-legend{display:flex; gap:14px; padding:0 14px 8px; font-size:11px; color:var(--ink-2); flex-wrap:wrap}
.cov-legend.cov-type-legend{padding-top:0; padding-bottom:12px}
.cov-legend .lg-item{display:inline-flex; align-items:center; gap:5px}
.cov-legend .lg-dot{width:14px; height:14px; border-radius:6px; display:inline-block; flex:0 0 auto}
.cov-legend .lg-round{width:10px; height:10px; border-radius:50%; display:inline-block; flex:0 0 auto; box-shadow:0 0 0 2px #fff, 0 0 0 3px var(--hairline)}
.cov-list{padding:0 0 96px}
.cov-card{background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:14px 14px 15px; margin:0 14px 14px}
.cov-card .ch{display:flex; align-items:center; gap:9px}
.cov-card .cname{font-weight:800; font-size:14.5px; flex:0 0 auto; white-space:nowrap}
.cov-card .cbar{flex:1; height:8px; border-radius:4px; background:#f0efec; overflow:hidden}
.cov-card .cbar i{display:block; height:100%; border-radius:4px}
.cov-card .cnum{font-size:11px; color:var(--ink-3); flex:0 0 auto; font-variant-numeric:tabular-nums}
.cov-city{margin-top:14px}
.cov-city:first-of-type{margin-top:12px}
.cov-city .cc-head{font-size:11.5px; color:var(--ink-2); font-weight:800; margin:0 0 7px; display:flex; align-items:baseline; gap:5px}
.cov-city .cc-head .ccnum{color:var(--ink-3); font-weight:400}
.name-chip-wrap{display:flex; flex-wrap:wrap; gap:7px}
.name-chip{
  display:inline-flex; align-items:center; gap:6px; padding:7px 12px 7px 9px; border-radius:11px;
  font-size:12.5px; font-weight:700; cursor:pointer; max-width:100%; line-height:1.3;
  box-shadow:0 1px 2px rgba(11,11,11,.07);
}
.name-chip .tdot{
  width:9px; height:9px; border-radius:50%; flex:0 0 auto;
  box-shadow:0 0 0 2px rgba(255,255,255,.95);
}
.name-chip .nm{overflow-wrap:anywhere}
.name-chip .cnt{font-weight:400; font-size:10.5px; opacity:.85}
.name-chip.v{background:var(--visited); color:#fff; box-shadow:0 2px 5px rgba(235,104,52,.35)}
.name-chip.w{background:#fff6e0; border:2px solid var(--want); color:#8a6200; box-shadow:0 2px 5px rgba(237,161,0,.2)}
.name-chip.u{background:#f5f4f1; border:1px solid #e4e2da; color:var(--ink-2)}
.cov-more{width:100%; font-size:11px; color:var(--ink-3); padding-top:4px}
.cov-empty-note{margin-top:10px}
/* ---------- list view ---------- */
.list-head{position:sticky; top:0; background:var(--page); padding:10px 14px 6px; z-index:10}
.searchbox{
  width:100%; border:1px solid var(--hairline); border-radius:10px; background:var(--surface-1);
  padding:9px 12px; font-size:14px; font-family:inherit; color:var(--ink-1);
}
.list-filters{display:flex; gap:6px; margin-top:8px; overflow-x:auto; scrollbar-width:none}
.list-filters::-webkit-scrollbar{display:none}
.pref-group{margin:6px 14px 14px}
.pref-group h3{
  font-size:12px; color:var(--ink-2); margin:12px 2px 6px; display:flex; align-items:center; gap:8px;
}
.pref-group h3 .bar{flex:1; height:6px; border-radius:3px; background:var(--hairline); overflow:hidden}
.pref-group h3 .bar i{display:block; height:100%; background:var(--seq-400); border-radius:3px}
.pref-group h3 .num{color:var(--ink-3); font-weight:400; font-size:11px}
.frow{
  background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius);
  padding:11px 13px; margin-bottom:7px; display:flex; align-items:center; gap:11px; cursor:pointer;
}
.frow .st{flex:0 0 auto; width:13px; height:13px; border-radius:50%}
.frow .st.v{background:var(--visited)}
.frow .st.u{background:#fff; border:2.5px solid var(--unvisited); opacity:.7}
.frow .st.w{background:var(--want); border-radius:0; clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); width:15px; height:15px}
.frow .info{flex:1; min-width:0}
.frow .nm{font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.frow .meta{font-size:11px; color:var(--ink-3); margin-top:2px; display:flex; gap:6px; align-items:center}
.badge{font-size:9.5px; font-weight:800; padding:1.5px 6px; border-radius:8px; letter-spacing:.03em}
.badge.onsen{background:#fde8dc; color:#b04a1e}
.badge.sauna{background:#dcebfb; color:#1c5cab}
.badge.spa{background:#e2f4ec; color:#0a7a52}
.badge.sento{background:#f3ecdb; color:#8a6d1a}
.frow .right{flex:0 0 auto; text-align:right; font-size:11px; color:var(--ink-3)}
.frow .stars{color:var(--want); font-size:12px; letter-spacing:1px}
.empty-note{text-align:center; color:var(--ink-3); font-size:12.5px; padding:40px 20px}
/* ---------- stats view ---------- */
.stats-wrap{padding:14px; max-width:560px; margin:0 auto}
.hero-card{
  background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px 18px; text-align:center; margin-bottom:12px;
}
.hero-card .label{font-size:12px; color:var(--ink-2); font-weight:700}
.hero-card .big{font-size:46px; font-weight:800; line-height:1.1; color:var(--seq-600)}
.hero-card .big small{font-size:22px}
.hero-card .under{font-size:12px; color:var(--ink-3); margin-top:4px}
.stat-tiles{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:12px}
.tile{background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:12px 8px; text-align:center}
.tile .v{font-size:22px; font-weight:800}
.tile .k{font-size:10.5px; color:var(--ink-3); margin-top:2px}
.tile.t-visit .v{color:var(--visited)}
.tile.t-want .v{color:#c98500}
.tile.t-cnt .v{color:var(--seq-500)}
.panel{background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:15px 16px; margin-bottom:12px}
.panel h3{margin:0 0 12px; font-size:13px; font-weight:800; color:var(--ink-1)}
.pbar-row{display:flex; align-items:center; gap:9px; margin-bottom:9px}
.pbar-row .pname{flex:0 0 58px; font-size:12px; font-weight:700; color:var(--ink-2)}
.pbar-row .track{flex:1; height:14px; background:#f0efec; border-radius:4px; overflow:hidden}
.pbar-row .track i{display:block; height:100%; border-radius:4px 0 0 4px}
.pbar-row .pv{flex:0 0 62px; font-size:11px; color:var(--ink-3); text-align:right; font-variant-numeric:tabular-nums}
.type-row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--hairline); font-size:13px}
.type-row:last-child{border-bottom:0}
.type-row .tv{font-weight:800; font-variant-numeric:tabular-nums}
.recent-row{display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--hairline); font-size:12.5px}
.recent-row:last-child{border-bottom:0}
.recent-row .d{color:var(--ink-3); flex:0 0 auto; font-variant-numeric:tabular-nums}
.recent-row .n{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600}
/* ---------- bottom sheet ---------- */
.sheet-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:1200; display:none;
}
.sheet-backdrop.show{display:block}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:1300; background:var(--surface-1);
  border-radius:18px 18px 0 0; max-height:82vh; overflow-y:auto; display:none;
  padding:8px 18px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 24px rgba(0,0,0,.18);
}
.sheet.show{display:block}
.sheet .grip{width:38px; height:4px; border-radius:2px; background:var(--hairline); margin:4px auto 12px}
.sheet-x{
  position:fixed; z-index:1400; right:14px; width:32px; height:32px; border-radius:50%;
  border:0; background:var(--surface-1); color:var(--ink-2); font-size:15px; font-weight:800;
  cursor:pointer; display:none; align-items:center; justify-content:center; font-family:inherit;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
}
.sheet-x.show{display:flex}
.sheet-x:active{background:var(--hairline)}
.sheet h2{margin:0 0 2px; font-size:17px; font-weight:800; line-height:1.35}
.sheet .loc{font-size:12px; color:var(--ink-3); margin-bottom:12px}
.sheet-sec{border-top:1px solid var(--hairline); padding:13px 0}
.sheet-sec .sec-t{font-size:11.5px; font-weight:800; color:var(--ink-2); margin-bottom:8px}
.star-row{display:flex; gap:6px; font-size:29px; cursor:pointer; user-select:none}
.star-row span{color:#dcdbd4}
.star-row span.on{color:var(--want)}
.want-toggle{
  display:flex; align-items:center; justify-content:space-between; font-size:14px; font-weight:700;
}
.switch{position:relative; width:46px; height:27px; flex:0 0 auto}
.switch input{opacity:0; width:0; height:0}
.switch .sl{
  position:absolute; inset:0; background:#dcdbd4; border-radius:14px; cursor:pointer; transition:.15s;
}
.switch .sl:before{
  content:""; position:absolute; width:21px; height:21px; border-radius:50%; background:#fff;
  top:3px; left:3px; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.switch input:checked + .sl{background:var(--want)}
.switch input:checked + .sl:before{transform:translateX(19px)}
.info-row{display:flex; gap:8px; font-size:13px; padding:3.5px 0; line-height:1.55}
.info-row .ik{flex:0 0 20px; text-align:center}
.info-row a{color:var(--accent); font-weight:700; word-break:break-all; text-decoration:none}
.info-row .iv{min-width:0; word-break:break-word}
.sec-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px}
.sec-head .sec-t{margin-bottom:0}
.mini-btn{border:1px solid var(--hairline); background:var(--surface-1); color:var(--ink-2);
  border-radius:8px; padding:5px 9px; font-size:11px; font-weight:800; font-family:inherit; cursor:pointer}
.visit-item{display:flex; align-items:center; justify-content:space-between; padding:5px 0; font-size:13.5px}
.visit-item .vd{font-variant-numeric:tabular-nums}
.visit-item button{border:0; background:none; color:var(--ink-3); font-size:15px; cursor:pointer; padding:4px 6px}
.add-visit{display:flex; gap:8px; margin-top:8px}
.add-visit input[type=date]{
  flex:1; border:1px solid var(--hairline); border-radius:9px; padding:8px 10px; font-family:inherit; font-size:13.5px; background:var(--surface-1); color:var(--ink-1);
}
.btn{
  border:0; border-radius:10px; padding:10px 15px; font-family:inherit; font-size:13.5px; font-weight:800; cursor:pointer;
}
.btn.primary{background:var(--accent); color:#fff}
.btn.visited-mark{background:var(--visited); color:#fff; width:100%; padding:13px; font-size:15px; border-radius:12px}
.btn.ghost{background:none; border:1px solid var(--hairline); color:var(--ink-2)}
.btn.danger-ghost{background:none; border:1px solid #f3d2d2; color:#c0392b}
.sheet-actions{display:flex; gap:8px; margin-top:4px}
.sheet-actions .btn{flex:1}
/* ---------- add / edit form ---------- */
.form-field{margin-bottom:12px}
.form-field label{display:block; font-size:11.5px; font-weight:800; color:var(--ink-2); margin-bottom:5px}
.form-field input[type=text], .form-field select{
  width:100%; border:1px solid var(--hairline); border-radius:9px; padding:9px 11px;
  font-family:inherit; font-size:14px; background:var(--surface-1); color:var(--ink-1);
}
.seg{display:flex; border:1px solid var(--hairline); border-radius:9px; overflow:hidden}
.seg button{flex:1; border:0; background:none; padding:8px 2px; font-family:inherit; font-size:12px; font-weight:700; color:var(--ink-3); cursor:pointer}
.seg button.on{background:var(--ink-1); color:#fff}
.geo-results{margin-top:6px}
.geo-item{
  padding:9px 11px; border:1px solid var(--hairline); border-radius:9px; margin-bottom:6px;
  font-size:12.5px; cursor:pointer; background:var(--surface-1);
}
.geo-item .g1{font-weight:700}
.geo-item .g2{color:var(--ink-3); font-size:11px; margin-top:1px}
.hint{font-size:11px; color:var(--ink-3); line-height:1.6}
/* ---------- menu sheet ---------- */
.menu-item{
  display:flex; align-items:center; gap:10px; padding:13px 2px; border-bottom:1px solid var(--hairline);
  font-size:14px; font-weight:700; cursor:pointer; background:none; border-left:0; border-right:0; border-top:0;
  width:100%; font-family:inherit; color:var(--ink-1); text-align:left;
}
.menu-item:last-child{border-bottom:0}
.menu-item .mi{font-size:17px; width:24px; text-align:center}
.menu-item .md{font-size:11px; color:var(--ink-3); font-weight:400; display:block; margin-top:1px}
.toast{
  position:fixed; bottom:calc(76px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  background:var(--ink-1); color:#fff; border-radius:20px; padding:9px 18px; font-size:13px; font-weight:700;
  z-index:2000; display:none; white-space:nowrap; box-shadow:0 3px 12px rgba(0,0,0,.3);
}
.toast.show{display:block; animation:toastin .2s ease}
@keyframes toastin{from{opacity:0; transform:translate(-50%,8px)}to{opacity:1; transform:translate(-50%,0)}}
</style>
</head>
<body>

<header>
  <div class="title">
    <h1>♨️ 関東 温泉・サウナマップ</h1>
    <div class="sub" id="headSub">カバレッジ記録</div>
  </div>
  <div class="coverage-pill">
    <div class="pct" id="headPct">0%</div>
    <div class="cnt" id="headCnt">0 / 0 施設</div>
  </div>
  <button class="icon-btn" id="menuBtn" title="メニュー">☰</button>
</header>

<main>
  <!-- COVERAGE（都県カード＋スタンプ格子） -->
  <div class="view active" id="view-coverage">
    <div class="filterbar" id="covFilterbar">
      <button class="chip on" data-cstatus="all">すべて</button>
      <button class="chip" data-cstatus="visited">✔ 訪問済み</button>
      <button class="chip" data-cstatus="want">★ 行きたい</button>
      <button class="chip" data-cstatus="unvisited">未訪問</button>
      <select class="chip" id="covTypeFilter">
        <option value="all">全種別</option>
        <option value="onsen">温泉</option>
        <option value="sauna">サウナ</option>
        <option value="spa">スパ・スーパー銭湯</option>
        <option value="sento">銭湯</option>
      </select>
    </div>
    <div class="cov-legend">
      <span class="lg-item"><i class="lg-dot" style="background:var(--visited)"></i>訪問済み</span>
      <span class="lg-item"><i class="lg-dot" style="background:#fff8e8;border:2px solid var(--want)"></i>行きたい</span>
      <span class="lg-item"><i class="lg-dot" style="background:#f3f2ef;border:1px solid #e4e2da"></i>未訪問</span>
    </div>
    <div class="cov-legend cov-type-legend">
      <span class="lg-item" style="color:var(--ink-3)">種別：</span>
      <span class="lg-item"><i class="lg-round" style="background:var(--type-onsen)"></i>温泉</span>
      <span class="lg-item"><i class="lg-round" style="background:var(--type-sauna)"></i>サウナ</span>
      <span class="lg-item"><i class="lg-round" style="background:var(--type-spa)"></i>スパ・銭湯+</span>
      <span class="lg-item"><i class="lg-round" style="background:var(--type-sento)"></i>銭湯</span>
    </div>
    <div class="cov-list" id="covBody"></div>
  </div>

  <!-- LIST -->
  <div class="view" id="view-list">
    <div class="list-head">
      <input class="searchbox" id="listSearch" type="text" placeholder="施設名・エリアで検索">
      <div class="list-filters" id="listFilters">
        <button class="chip on" data-lstatus="all">すべて</button>
        <button class="chip" data-lstatus="visited">✔ 訪問済み</button>
        <button class="chip" data-lstatus="want">★ 行きたい</button>
        <button class="chip" data-lstatus="unvisited">未訪問</button>
      </div>
    </div>
    <div id="listBody"></div>
  </div>

  <!-- STATS -->
  <div class="view" id="view-stats">
    <div class="stats-wrap" id="statsBody"></div>
  </div>
</main>

<nav class="tabs">
  <button class="active" data-view="coverage"><span class="ico">🏅</span>カバレッジ</button>
  <button data-view="list"><span class="ico">📋</span>リスト</button>
  <button data-view="stats"><span class="ico">📊</span>統計</button>
</nav>

<button class="fab" id="fabAdd" title="施設を追加">＋</button>

<!-- detail sheet -->

const TYPE_LABEL = {onsen:"温泉", sauna:"サウナ", spa:"スパ・スーパー銭湯", sento:"銭湯"};

const LS_KEY = "onsen_sauna_map_v1";

/* ================= store ================= */
function loadStore(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const s = JSON.parse(raw); if(s && s.v===1){ s.photos = s.photos || {}; return s; } }
  }catch(e){}
  return {v:1, custom:[], records:{}, hidden:[], edits:{}, photos:{}};
}
let store = loadStore();
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){ toast("保存に失敗しました（容量超過の可能性）"); } }

function allFacilities(){
  const hid = new Set(store.hidden);
  const out = [];
  for(const p of PRESETS){
    if(hid.has(p.id)) continue;
    const e = store.edits[p.id];
    out.push(e ? Object.assign({}, p, e) : p);
  }
  for(const c of store.custom) out.push(c);
  return out;
}
function rec(id){ return store.records[id] || {visits:[], rating:0, want:false}; }
function setRec(id, r){
  if(!r.visits.length && !r.rating && !r.want){ delete store.records[id]; }
  else store.records[id] = r;
  save();
}
function isVisited(id){ return rec(id).visits.length > 0; }
function statusOf(id){
  const r = rec(id);
  if(r.visits.length) return "visited";
  if(r.want) return "want";
  return "unvisited";
}

/* ================= helpers ================= */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(s){ const m=s.split("-"); return m[0]+"/"+m[1]+"/"+m[2]; }
function uid(){ return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
let toastTimer=null;
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}
function gmapUrl(f){
  return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(f.name+" "+f.pref+" "+(f.city||"").replace(/（.*?）/g,""));
}

/* point-in-polygon: 県自動判定 */
function pointInRing(lng,lat,ring){
  let inside=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
    if(((yi>lat)!==(yj>lat)) && (lng < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function prefOfPoint(lat,lng){
  for(const f of KANTO.features){
    const g=f.geometry;
    const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates;
    for(const poly of polys){
      if(pointInRing(lng,lat,poly[0])){
        let hole=false;
        for(let k=1;k<poly.length;k++) if(pointInRing(lng,lat,poly[k])){hole=true;break;}
        if(!hole) return f.properties.nam_ja;
      }
    }
  }
  return null;
}
/* 県ポリゴンの範囲（bbox）と中心点：OSM取り込みクエリ・新規施設の座標フォールバックに使用 */
function bboxOfFeature(f){
  let south=90,west=180,north=-90,east=-180;
  const g=f.geometry;
  const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates;
  for(const poly of polys) for(const ring of poly) for(const pt of ring){
    const lng=pt[0], lat=pt[1];
    if(lat<south) south=lat; if(lat>north) north=lat;
    if(lng<west) west=lng; if(lng>east) east=lng;
  }
  return {south:south,west:west,north:north,east:east};
}
const PREF_BBOX={}, PREF_CENTER={};
for(const f of KANTO.features){
  const b=bboxOfFeature(f);
  const name=f.properties.nam_ja;
  PREF_BBOX[name]=[b.south-0.02,b.west-0.02,b.north+0.02,b.east+0.02];
  PREF_CENTER[name]=[(b.south+b.north)/2,(b.west+b.east)/2];
}

/* ================= 都県カバレッジ集計 ================= */
function coverageByPref(){
  const m={};
  for(const p of PREFS) m[p]={total:0,visited:0};
  for(const f of allFacilities()){
    if(!m[f.pref]) continue;
    m[f.pref].total++;
    if(isVisited(f.id)) m[f.pref].visited++;
  }
  return m;
}
function covColor(ratio){
  if(ratio<=0) return "#f0efec";
  if(ratio<0.2) return "#cde2fb";
  if(ratio<0.4) return "#9ec5f4";
  if(ratio<0.6) return "#6da7ec";
  if(ratio<0.8) return "#3987e5";
  return "#256abf";
}

/* ================= header ================= */
function renderHeader(){
  const fs = allFacilities();
  const v = fs.filter(f=>isVisited(f.id)).length;
  const pct = fs.length? Math.round(100*v/fs.length):0;
  document.getElementById("headPct").textContent = pct+"%";
  document.getElementById("headCnt").textContent = v+" / "+fs.length+" 施設";
  const w = fs.filter(f=>rec(f.id).want && !isVisited(f.id)).length;
  document.getElementById("headSub").textContent = "行きたい "+w+"件・関東1都6県";
}

/* ================= coverage view（都県カード＋市区町村カテゴリ＋施設名） ================= */
let covStatusFilter="all";
function covPassFilter(f){
  const st=statusOf(f.id);
  if(covStatusFilter!=="all" && st!==covStatusFilter) return false;
  const tf=document.getElementById("covTypeFilter").value;
  if(tf!=="all" && f.type!==tf) return false;
  return true;
}
/* 「台東区（上野）」→「台東区」のように市区町村部分だけを取り出す。無ければ「その他」 */
function cityKeyOf(f){
  const c=(f.city||"").trim();
  if(!c) return "その他";
  const m=c.match(/^([^（(]+)/);
  return (m? m[1].trim() : c) || "その他";
}
function groupByCity(list){
  const map=new Map();
  for(const f of list){
    const k=cityKeyOf(f);
    if(!map.has(k)) map.set(k,[]);
    map.get(k).push(f);
  }
  return map;
}
const COV_CAP=1500;
function renderCoverage(){
  const body=document.getElementById("covBody");
  const cov=coverageByPref();
  let html="";
  for(const pref of PREFS){
    const all=allFacilities().filter(f=>f.pref===pref);
    const filtered=all.filter(covPassFilter);
    const c=cov[pref]||{total:0,visited:0};
    const pct=c.total? Math.round(100*c.visited/c.total):0;

    const groups=groupByCity(filtered);
    let cityKeys=Array.from(groups.keys()).sort((a,b)=>{
      if(a==="その他") return 1;
      if(b==="その他") return -1;
      return a.localeCompare(b,"ja");
    });

    let used=0, leftover=0, citiesHtml="";
    for(const key of cityKeys){
      let items=groups.get(key).sort((a,b)=>{
        const ord={visited:0,want:1,unvisited:2};
        const sa=statusOf(a.id), sb=statusOf(b.id);
        if(ord[sa]!==ord[sb]) return ord[sa]-ord[sb];
        return a.name.localeCompare(b.name,"ja");
      });
      if(used>=COV_CAP){ leftover+=items.length; continue; }
      if(used+items.length>COV_CAP){ leftover+=items.length-(COV_CAP-used); items=items.slice(0,COV_CAP-used); }
      used+=items.length;
      const chips=items.map(f=>{
        const st=statusOf(f.id);
        const r=rec(f.id);
        const cls= st==="visited"?"v": st==="want"?"w":"u";
        const prefix= st==="visited"?"✔ ": st==="want"?"★ ":"";
        const cnt=(st==="visited"&&r.visits.length>1)? '<span class="cnt">×'+r.visits.length+'</span>':"";
        const tdot='<span class="tdot" style="background:var(--type-'+f.type+')"></span>';
        return '<span class="name-chip '+cls+'" title="'+esc(TYPE_LABEL[f.type]||"")+'" onclick="openDetail(\''+f.id+'\')">'+
          tdot+'<span class="nm">'+prefix+esc(f.name)+'</span>'+cnt+'</span>';
      }).join("");
      citiesHtml += '<div class="cov-city"><div class="cc-head">'+esc(key)+'<span class="ccnum">（'+items.length+'）</span></div>'+
        '<div class="name-chip-wrap">'+chips+'</div></div>';
    }
    if(leftover>0) citiesHtml += '<div class="cov-more">…ほか'+leftover+'件（リストタブで確認できます）</div>';

    html += '<div class="cov-card"><div class="ch"><span class="cname">'+pref.replace("神奈川県","神奈川").replace(/[都県]$/,"")+'</span>'+
      '<span class="cbar"><i style="width:'+pct+'%; background:'+(pct>0?covColor(Math.max(pct/100,0.05)):"transparent")+'"></i></span>'+
      '<span class="cnum">'+c.visited+'/'+c.total+'</span></div>'+
      (filtered.length
        ? citiesHtml
        : '<div class="hint cov-empty-note">'+(all.length? "フィルタに合う施設がありません" : "施設がありません")+'</div>')+
      '</div>';
  }
  body.innerHTML = html;
}

/* ================= list view ================= */
let listStatusFilter="all";
function renderList(){
  const q = document.getElementById("listSearch").value.trim().toLowerCase();
  const body = document.getElementById("listBody");
  const cov = coverageByPref();
  let html="";
  let shown=0;
  for(const pref of PREFS){
    const fs = allFacilities().filter(f=>f.pref===pref)
      .filter(f=>{
        const st=statusOf(f.id);
        if(listStatusFilter!=="all" && st!==listStatusFilter) return false;
        if(q && !( (f.name+" "+(f.city||"")+" "+f.pref).toLowerCase().includes(q) )) return false;
        return true;
      })
      .sort((a,b)=>{
        const sa=statusOf(a.id), sb=statusOf(b.id);
        const ord={visited:0,want:1,unvisited:2};
        if(ord[sa]!==ord[sb]) return ord[sa]-ord[sb];
        return a.name.localeCompare(b.name,"ja");
      });
    if(!fs.length) continue;
    if(shown>=500){ html+='<div class="empty-note">表示上限に達しました。検索やフィルタで絞り込んでください</div>'; break; }
    const c = cov[pref]||{total:0,visited:0};
    const pct = c.total? Math.round(100*c.visited/c.total):0;
    html += '<div class="pref-group"><h3>'+pref+
      '<span class="bar"><i style="width:'+pct+'%"></i></span>'+
      '<span class="num">'+c.visited+'/'+c.total+'</span></h3>';
    for(const f of fs){
      if(shown>=500){ html+='<div class="empty-note">…ほか'+(fs.length-fs.indexOf(f))+'件（検索で絞り込めます）</div>'; break; }
      shown++;
      const st = statusOf(f.id);
      const r = rec(f.id);
      const stCls = st==="visited"?"v": st==="want"?"w":"u";
      html += '<div class="frow" onclick="openDetail(\''+f.id+'\')">'+
        '<span class="st '+stCls+'"></span>'+
        '<span class="info"><span class="nm">'+esc(f.name)+'</span>'+
        '<span class="meta"><span class="badge '+f.type+'">'+(TYPE_LABEL[f.type]||"")+'</span>'+esc(f.city||"")+'</span></span>'+
        '<span class="right">'+
        (r.rating? '<div class="stars">'+"★".repeat(r.rating)+'</div>':"")+
        (r.visits.length? '<div>'+r.visits.length+'回</div>':"")+
        '</span></div>';
    }
    html += '</div>';
  }
  if(!shown) html = '<div class="empty-note">該当する施設がありません</div>';
  body.innerHTML = html;
}

/* ================= stats view ================= */
function renderStats(){
  const fs = allFacilities();
  const v = fs.filter(f=>isVisited(f.id));
  const pct = fs.length? Math.round(100*v.length/fs.length):0;
  const totalVisits = fs.reduce((s,f)=>s+rec(f.id).visits.length,0);
  const wants = fs.filter(f=>rec(f.id).want && !isVisited(f.id)).length;
  const cov = coverageByPref();

  const hid=new Set(store.hidden);
  const presetVisible=PRESETS.filter(p=>!hid.has(p.id));
  const presetVisited=presetVisible.filter(p=>isVisited(p.id)).length;
  const hasOsm=osmCount()>0;
  let html = '<div class="hero-card"><div class="label">関東制覇率</div>'+
    '<div class="big">'+pct+'<small>%</small></div>'+
    '<div class="under">'+v.length+' / '+fs.length+' 施設を訪問</div>'+
    (hasOsm? '<div class="under" style="margin-top:2px">うち有名どころ（厳選'+presetVisible.length+'件）: '+presetVisited+'件制覇（'+(presetVisible.length?Math.round(100*presetVisited/presetVisible.length):0)+'%）</div>':"")+
    '</div>';

  html += '<div class="stat-tiles">'+
    '<div class="tile t-visit"><div class="v">'+v.length+'</div><div class="k">訪問施設</div></div>'+
    '<div class="tile t-cnt"><div class="v">'+totalVisits+'</div><div class="k">のべ訪問回数</div></div>'+
    '<div class="tile t-want"><div class="v">'+wants+'</div><div class="k">行きたい</div></div></div>';

  html += '<div class="panel"><h3>都県別カバレッジ</h3>';
  for(const p of PREFS){
    const c = cov[p]||{total:0,visited:0};
    const r = c.total? c.visited/c.total:0;
    const w = Math.round(r*100);
    html += '<div class="pbar-row"><span class="pname">'+p.replace("神奈川県","神奈川").replace(/[都県]$/,"")+'</span>'+
      '<span class="track"><i style="width:'+w+'%; background:'+(w>0?covColor(Math.max(r,0.05)):"transparent")+'"></i></span>'+
      '<span class="pv">'+c.visited+'/'+c.total+'（'+w+'%）</span></div>';
  }
  html += '</div>';

  html += '<div class="panel"><h3>種別ごとの訪問</h3>';
  for(const t of ["onsen","sauna","spa","sento"]){
    const all = fs.filter(f=>f.type===t);
    if(!all.length) continue;
    const vv = all.filter(f=>isVisited(f.id)).length;
    html += '<div class="type-row"><span><span class="badge '+t+'">'+TYPE_LABEL[t]+'</span></span><span class="tv">'+vv+' / '+all.length+'</span></div>';
  }
  html += '</div>';

  const recent = [];
  for(const f of fs){
    for(const d of rec(f.id).visits) recent.push({d:d, n:f.name});
  }
  recent.sort((a,b)=>b.d.localeCompare(a.d));
  if(recent.length){
    html += '<div class="panel"><h3>最近の訪問</h3>';
    for(const x of recent.slice(0,8)){
      html += '<div class="recent-row"><span class="d">'+fmtDate(x.d)+'</span><span class="n">'+esc(x.n)+'</span></div>';
    }
    html += '</div>';
  }

  const rated = fs.filter(f=>rec(f.id).rating>=4).sort((a,b)=>rec(b.id).rating-rec(a.id).rating);
  if(rated.length){
    html += '<div class="panel"><h3>お気に入り（★4以上）</h3>';
    for(const f of rated.slice(0,8)){
      html += '<div class="recent-row"><span class="n">'+esc(f.name)+'</span><span style="color:#c98500;font-weight:800">'+"★".repeat(rec(f.id).rating)+'</span></div>';

  const r = rec(currentId);

  const f = allFacilities().find(x=>x.id===currentId);

}

/* 1施設だけOSMから詳細取得 */
async function fetchDetailOsm(){
  const f=allFacilities().find(x=>x.id===currentId);
  if(!f) return;
  toast("OSMから取得中…");
  const q='[out:json][timeout:25];(nwr["amenity"="public_bath"](around:500,'+f.lat+','+f.lng+');nwr["leisure"="sauna"](around:500,'+f.lat+','+f.lng+'););out center tags;';
  try{
    const js=await overpassFetch(q);
    const els=(js.elements||[]).filter(e=>e.tags);
    if(!els.length){ toast("近く（500m以内）にOSMの温浴データがありませんでした"); return; }
    const fn=normName(f.name);
    let best=els.find(e=>{
      const n=e.tags["name:ja"]||e.tags.name;
      return n && (normName(n).includes(fn)||fn.includes(normName(n)));
    });
    if(!best){
      /* 名前一致なし → 最も近いPOI */
      let bd=Infinity;
      for(const e of els){
        const la=(e.lat!=null)?e.lat:(e.center&&e.center.lat), lo=(e.lon!=null)?e.lon:(e.center&&e.center.lon);
        if(la==null) continue;
        const d=distM(f.lat,f.lng,la,lo);
        if(d<bd){bd=d;best=e;}
      }
    }
    if(!best){ toast("該当データが見つかりませんでした"); return; }
    const info=tagsToInfo(best.tags);
    if(!Object.keys(info).length){ toast("OSM側に詳細タグ（住所・営業時間等）が未登録でした"); return; }
    applyInfo(currentId, info, true);
    save(); refreshAll(); openDetail(currentId);
    toast("取得しました（"+Object.keys(info).length+"項目）");
  }catch(e){ toast("取得に失敗しました。時間をおいて再実行してください"); }
}

/* ================= OSM 一括取り込み ================= */
const OVERPASS_EPS=[
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
  "https://overpass.osm.jp/api/interpreter"
];
function distM(lat1,lng1,lat2,lng2){
  const R=6371000, x=(lat2-lat1)*Math.PI/180,
        y=(lng2-lng1)*Math.PI/180*Math.cos((lat1+lat2)/2*Math.PI/180);
  return R*Math.sqrt(x*x+y*y);
}
function normName(s){ return String(s).toLowerCase().replace(/[\s　・]/g,"").replace(/[ヶケ]/g,"ケ"); }
function osmTypeOf(t,name){
  if(t.leisure==="sauna" || /サウナ|sauna/i.test(name)) return "sauna";
  const bt=(t["bath:type"]||"").toLowerCase();
  if(bt.includes("onsen") || name.includes("温泉")) return "onsen";
  if(bt.includes("sento") || /銭湯|湯$/.test(name)) return "sento";
  return "spa";
}
function osmCount(){ return store.custom.filter(c=>c.src==="osm").length; }
function jpHours(s){
  return String(s).replace(/Mo/g,"月").replace(/Tu/g,"火").replace(/We/g,"水").replace(/Th/g,"木")
    .replace(/Fr/g,"金").replace(/Sa/g,"土").replace(/Su/g,"日").replace(/PH/g,"祝")
    .replace(/\boff\b/g,"休").replace(/24\/7/g,"24時間").replace(/;\s*/g," ／ ").replace(/,/g,"・");
}
function tagsToInfo(t){
  const info={};
  const addr=t["addr:full"]||[t["addr:city"],t["addr:quarter"]||t["addr:suburb"]||t["addr:neighbourhood"],
    (t["addr:block_number"]&&t["addr:housenumber"])?t["addr:block_number"]+"-"+t["addr:housenumber"]:(t["addr:housenumber"]||"")]
    .filter(Boolean).join("");
  if(addr) info.addr=addr;
  const ph=t.phone||t["contact:phone"]; if(ph) info.phone=ph;
  const web=t.website||t["contact:website"]||t.url; if(web) info.web=web;
  if(t.opening_hours) info.hours=jpHours(t.opening_hours);
  const fee=t.charge||((t.fee&&/\d/.test(t.fee))?t.fee:null); if(fee) info.fee=fee;
  return info;
}
/* infoをマージ（fillOnly=trueなら未設定の項目だけ埋める） */
function applyInfo(id, info, fillOnly){
  if(!info) return;
  const cur=(allFacilities().find(x=>x.id===id)||{}).info||{};
  const merged=fillOnly? Object.assign({}, info, cur) : Object.assign({}, cur, info);
  for(const k of Object.keys(merged)) if(!merged[k]) delete merged[k];
  if(id.startsWith("p")){
    store.edits[id]=Object.assign({}, store.edits[id]||{}, {info:merged});
  }else{
    const c=store.custom.find(x=>x.id===id);
    if(c) c.info=merged;
  }
}

    '名前が登録されていない施設と、既存施設と重複するものは自動で除外します。都県ごとに数十秒かかることがあります。</div>'+
    '<div class="form-field"><label>取り込む範囲</label><select id="impPref">'+
    '<option value="all">関東ぜんぶ（1都6県を順番に取得）</option>'+
    PREFS.map(p=>'<option value="'+p+'">'+p+'のみ</option>').join("")+

async function overpassFetch(q){
  let lastErr=null;
  for(const ep of OVERPASS_EPS){
    try{
      const res=await fetch(ep,{method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"data="+encodeURIComponent(q)});
      if(!res.ok) throw new Error("HTTP "+res.status);
      return await res.json();
    }catch(e){ lastErr=e; }
  }
  throw lastErr||new Error("接続失敗");
}
function mergeOsm(els, pref){
  const existing=allFacilities();
  let added=0, skipped=0;
  for(const el of els){
    const t=el.tags||{};
    const lat=(el.lat!=null)?el.lat:(el.center&&el.center.lat);
    const lng=(el.lon!=null)?el.lon:(el.center&&el.center.lon);
    if(lat==null||lng==null){skipped++;continue;}
    const name=t["name:ja"]||t.name;
    if(!name){skipped++;continue;}
    if(prefOfPoint(lat,lng)!==pref){skipped++;continue;}
    const oid="o"+el.type.charAt(0)+el.id;
    if(existing.some(f=>f.id===oid)){skipped++;continue;}
    const nn=normName(name);
    let dupOf=null;
    for(const f of existing){
      if(Math.abs(f.lat-lat)>0.006||Math.abs(f.lng-lng)>0.007) continue;
      const d=distM(f.lat,f.lng,lat,lng);
      const fn=normName(f.name);
      if(d<80 || (d<400 && (fn.includes(nn)||nn.includes(fn)))){dupOf=f;break;}
    }
    if(dupOf){
      /* 重複POIのタグで既存施設（プリセット含む）の詳細情報を補完 */
      applyInfo(dupOf.id, tagsToInfo(t), true);
      skipped++; continue;
    }
    const fac={id:oid,name:name,type:osmTypeOf(t,name),pref:pref,city:t["addr:city"]||"",lat:lat,lng:lng,src:"osm"};
    const inf=tagsToInfo(t);
    if(Object.keys(inf).length) fac.info=inf;
    store.custom.push(fac); existing.push(fac); added++;
  }
  return {added:added, skipped:skipped};
}
async function runImport(){
  if(importing) return;
  importing=true;
  const btn=document.getElementById("impRun");
  const prog=document.getElementById("impProg");
  btn.disabled=true; btn.textContent="取得中…";
  const sel=document.getElementById("impPref").value;
  const targets=(sel==="all")?PREFS:[sel];
  let totalAdded=0, log="";
  for(const pref of targets){
    prog.textContent=log+pref+" を取得中…";
    const bb=PREF_BBOX[pref].join(",");
    const q='[out:json][timeout:90];(nwr["amenity"="public_bath"]('+bb+');nwr["leisure"="sauna"]('+bb+'););out center tags;';
    try{
      const js=await overpassFetch(q);
      const r=mergeOsm(js.elements||[], pref);
      totalAdded+=r.added;
      log+=pref+": "+r.added+"件 追加\n";
    }catch(e){
      log+=pref+": 取得失敗（時間をおいて再実行してください）\n";
    }
    prog.textContent=log;
    save();
    if(targets.length>1) await new Promise(r=>setTimeout(r,1200));
  }
  refreshAll();
  prog.textContent=log+"\n完了！ 合計 "+totalAdded+"件を追加しました（現在 "+allFacilities().length+"施設）";
  btn.disabled=false; btn.textContent="取り込みを開始";
  importing=false;
  toast(totalAdded+"件の施設を追加しました");
}
function clearOsm(){
  const oc=osmCount();
  if(!oc) return;
  if(!confirm("OSMから取り込んだ"+oc+"件と、その訪問記録をすべて削除します。よろしいですか？")) return;
  const ids=new Set(store.custom.filter(c=>c.src==="osm").map(c=>c.id));
  store.custom=store.custom.filter(c=>c.src!=="osm");
  for(const id of ids) delete store.records[id];
  save(); refreshAll(); openImport();
  toast(oc+"件を削除しました");
}

/* ================= sheets ================= */
function showSheet(id){
  document.getElementById("backdrop").classList.add("show");
  ["detailSheet","addSheet","menuSheet","importSheet"].forEach(s=>document.getElementById(s).classList.toggle("show", s===id));
  positionSheetClose();
}
function hideSheets(){
  document.getElementById("backdrop").classList.remove("show");
  ["detailSheet","addSheet","menuSheet","importSheet"].forEach(s=>document.getElementById(s).classList.remove("show"));
  document.getElementById("sheetX").classList.remove("show");
}
function positionSheetClose(){
  const openEl=["detailSheet","addSheet","menuSheet","importSheet"]
    .map(id=>document.getElementById(id)).find(el=>el.classList.contains("show"));
  const btn=document.getElementById("sheetX");
  if(!openEl){ btn.classList.remove("show"); return; }
  requestAnimationFrame(()=>{
    const r=openEl.getBoundingClientRect();
    btn.style.top=Math.max(10, r.top+10)+"px";
    btn.classList.add("show");
  });
}
document.getElementById("backdrop").onclick=hideSheets;
window.addEventListener("resize", positionSheetClose);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") hideSheets(); });

};
document.getElementById("mImport").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").addEventListener("change",e=>{
  const file=e.target.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const s=JSON.parse(rd.result);
      if(!s || s.v!==1 || !s.records) throw 0;
      if(!confirm("現在の記録をインポート内容で置き換えます。よろしいですか？")) return;
      store=s; save(); hideSheets(); refreshAll(); toast("インポートしました");
    }catch(err){ toast("読み込めないファイルです"); }
  };
  rd.readAsText(file);
  e.target.value="";
});
